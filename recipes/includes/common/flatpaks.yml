type: default-flatpaks
configurations:
  - scope: user
    # If no repo information is specified, Flathub will be used by default
    install:
      - org.gnome.baobab # Disk Analyzer
      - org.gnome.clocks # Clock
      - org.gnome.Loupe # Image Viewer
      - org.gnome.DejaDup # Backup
      - org.gnome.FileRoller # Archiver
      - org.gnome.NautilusPreviewer
      - org.gnome.Papers # Pdf Viewer
      - org.gnome.Calculator # Calculator
      - org.gnome.Calendar # Gnome Calendar
      - org.mozilla.firefox # Web Browser
      - io.github.IshuSinghSE.aurynk # Android Mirroring
      - org.cryptomator.Cryptomator # Encryption Tool
      - md.obsidian.Obsidian # Markdown Editor
      - org.localsend.localsend_app # File Sharing
      - io.ente.auth # 2FA
      - io.frama.tractor.carburetor # TOR Proxy
      - io.github.giantpinkrobots.varia # Download Manager
      - io.github.kolunmi.Bazaar # Flatpak App Store
      - io.mpv.Mpv # Video Player
      - it.mijorus.gearlever # AppImage Installer
