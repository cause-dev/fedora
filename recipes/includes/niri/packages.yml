---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
modules:
  - type: dnf
    install:
      install-weak-deps: false
      exclude:
        - gnome-keyring
        - waybar
        - swaylock
        - fuzzel
        - alacritty
      packages:
        - niri

  - type: dnf
    install:
      exclude:
        - gnome-keyring
        - waybar
        - swaylock
        - fuzzel
        - alacritty
      packages:
        - noctalia
        - nautilus
        - ptyxis
        - greetd
        - greetd-selinux
        - xdg-desktop-portal
        - xdg-desktop-portal-gnome
        - xdg-desktop-portal-gtk
        - pipewire
        - wireplumber
        - pipewire-pulseaudio
        - NetworkManager-wifi
        - tuned-ppd
        - bluez
        - oo7-daemon
        - oo7-portal
        - pam_oo7
        - oo7-cli
        - gcr

  - type: dnf
    repos:
      cleanup: true
      files:
        - https://github.com/terrapkg/subatomic-repos/raw/main/terra.repo
    install:
      no-gpgchecks: true
      packages:
        - noctalia-greeter
