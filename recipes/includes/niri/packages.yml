---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
modules:
  - type: dnf

    install:
      exclude:
        - gnome-keyring
        - waybar
        - swaylock
        - fuzzel
        - alacritty
      packages:
        - niri
        - noctalia
        - nautilus
        - ptyxis
        - greetd
        - greetd-selinux
        - pipewire-pulseaudio
        - NetworkManager-wifi
        - iwlwifi-mvm-firmware
        - bluez
        - oo7-portal
        - pam_oo7
        - oo7-cli
        - gcr
        - flatpak
        - mesa-vulkan-drivers
        - zram-generator-defaults
        - which
        - just

  - type: dnf
    repos:
      cleanup: true
      files:
        - https://github.com/terrapkg/subatomic-repos/raw/main/terra.repo
    install:
      packages:
        - noctalia-greeter
