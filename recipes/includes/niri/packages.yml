type: dnf
repos:
  cleanup: true
  files:
    - https://github.com/terrapkg/subatomic-repos/raw/main/terra.repo
install:
  packages:
    - noctalia
    - niri
    - nautilus
    - ptyxis
    - greetd
    - noctalia-greeter
    - terra-release
  exclude:
    - gnome-keyring
    - waybar
    - fuzzel
    - swaylock
    - alacritty
    - mako
    - swaync
    - dunst
    - notification-daemon
