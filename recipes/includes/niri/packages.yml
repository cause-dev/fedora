type: dnf
repos:
  cleanup: true
  files:
    - https://github.com/terrapkg/subatomic-repos/raw/main/terra.repo
install:
  exclude:
    - gnome-keyring
    - waybar
    - swaylock
    - fuzzel
    - alacritty

  packages:
    - install-weak-deps: false
      packages:
        - niri
    - noctalia
    - nautilus
    - ptyxis
    - greetd
    - greetd-selinux
    - noctalia-greeter
    - xdg-desktop-portal
    - xdg-desktop-portal-gnome
    - xdg-desktop-portal-gtk
    - pipewire
    - wireplumber
    - pipewire-pulseaudio
    - NetworkManager-wifi
    - tuned-ppd
    - bluez
    - oo7-daemon
    - oo7-portal
    - pam_oo7
    - oo7-cli
    - gcr
