type: dnf
repos:
  copr:
    - atim/starship
  files:
    - https://repo.protonvpn.com/fedora-%OS_VERSION%-stable/protonvpn-stable.repo
  keys:
    - https://repo.protonvpn.com/fedora-%OS_VERSION%-stable/public_key.asc
install:
  packages:
    - starship
    - fish
    - android-tools
    - bat
    - lsd
    - age
    - docker-compose
    - podman-docker
    - proton-vpn-gnome-desktop
remove:
  packages:
    # example: removing firefox (in favor of the flatpak)
    # "firefox" is the main package, "firefox-langpacks" is a dependency
    - firefox
    - firefox-langpacks # also remove firefox dependency (not required for all packages, this is a special case)
    - gnome-software
    - gnome-software-rpm-ostree
    - PackageKit-glib
