---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: fedora-gnome
description: This is my personal Fedora Gnome OS image.

base-image: ghcr.io/ublue-os/silverblue-main
image-version: latest

modules:
  - type: files
    files:
      - source: gnome/system
        destination: /

  - from-file: includes/common/packages.yml
  - from-file: includes/gnome/packages.yml
  - from-file: includes/common/fonts.yml
  - from-file: includes/gnome/bling.yml
  - from-file: includes/gnome/extensions.yml
  - from-file: includes/gnome/gschema.yml
  - from-file: includes/common/scripts.yml
  - from-file: includes/common/flatpaks.yml
  - from-file: includes/common/systemd.yml

  - type: signing
