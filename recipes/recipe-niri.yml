---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: fedora-niri
description: This is my personal fedora niri image.

base-image: quay.io/fedora/fedora-bootc
image-version: latest

modules:
  - type: files
    files:
      - source: niri/system
        destination: /

  - from-file: includes/common/packages.yml
  - from-file: includes/niri/packages.yml
  - from-file: includes/common/fonts.yml
  - from-file: includes/common/scripts.yml
  - from-file: includes/niri/scripts.yml
  - from-file: includes/niri/greeter-setup.yml
  - from-file: includes/common/flatpaks.yml
  - from-file: includes/common/systemd.yml
  - from-file: includes/niri/systemd.yml

  - type: initramfs

  - type: signing
